# Costruisce l'installatore per Windows e lo mette in una Release di questo repository.
# Parte a ogni modifica di main, ma lavora solo se la versione di package.json non ha ancora la sua Release
# (es. "version": "0.2.0" e nessuna Release v0.2.0): per pubblicare una versione nuova basta cambiare quel numero.
# L'applicazione installata guarda le Release all'apertura e chiede "C'è una versione nuova: la installo?".
# La Release nasce come bozza e si pubblica solo alla fine, con tutti i file (installatore, .blockmap e latest.yml):
# se electron-builder la crea da solo, i file caricati insieme provano a crearla due volte e il secondo si ferma
# ("already_exists"), come è successo alla prima v0.1.0. Se la costruzione si ferma a metà resta la bozza:
# rilanciando l'Action (Run workflow) si ricostruisce dentro la stessa bozza.
name: Installatore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installatore
  cancel-in-progress: false

jobs:
  installatore:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: C'è già la Release di questa versione?
        id: versione
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "versione=$v" >> "$GITHUB_OUTPUT"
          bozza=$(gh release view "v$v" --json isDraft --jq .isDraft 2>/dev/null || echo assente)
          if [ "$bozza" = "false" ]; then
            echo "La Release v$v c'è già: non costruisco niente."
            echo "nuova=no" >> "$GITHUB_OUTPUT"
          else
            echo "Costruisco la versione $v."
            echo "nuova=si" >> "$GITHUB_OUTPUT"
            echo "bozza=$bozza" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.versione.outputs.nuova == 'si'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - if: steps.versione.outputs.nuova == 'si'
        run: npm ci

      # Nel codice pubblico non ci devono essere codici ISIN veri. I dati dell'utente non sono qui:
      # il controllo con il file dei dati si fa sul PC, prima di mandare il codice.
      - if: steps.versione.outputs.nuova == 'si'
        run: npm run controlla-dati

      - if: steps.versione.outputs.nuova == 'si'
        run: npm test

      - if: steps.versione.outputs.nuova == 'si'
        run: npm run build

      - if: steps.versione.outputs.nuova == 'si' && steps.versione.outputs.bozza == 'assente'
        name: La bozza della Release v${{ steps.versione.outputs.versione }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.versione.outputs.versione }}
          {
            echo "**Scarica Portafoglio-titoli-$v.exe** qui sotto, in *Assets*, e aprilo per installarlo."
            echo
            echo "Al primo avvio Windows può dire «PC protetto da Windows»: scegli «Ulteriori informazioni» e poi «Esegui comunque»."
            echo
            echo "Se il programma è già installato non serve scaricare niente: all'apertura chiede da solo «C'è una versione nuova: la installo?»."
            echo
            echo "Come si apre e come si usa: [la guida](https://github.com/teodea/portafoglio#readme)."
          } > note.md
          gh release create "v$v" --draft --target "$GITHUB_SHA" --title "Portafoglio titoli $v" --notes-file note.md

      - if: steps.versione.outputs.nuova == 'si'
        name: Installatore nella bozza
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.versione.outputs.nuova == 'si'
        name: Pubblica la Release v${{ steps.versione.outputs.versione }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.versione.outputs.versione }}
          for f in "Portafoglio-titoli-$v.exe" "Portafoglio-titoli-$v.exe.blockmap" latest.yml; do
            gh release view "v$v" --json assets --jq '.assets[].name' | grep -qx "$f" || { echo "Nella bozza manca $f: non la pubblico."; exit 1; }
          done
          gh release edit "v$v" --draft=false --latest
